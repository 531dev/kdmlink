name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate configs
        run: node scripts/validate.mjs
      - name: Check decoded values on real captures
        run: node scripts/check-captures.mjs
      - name: Require version bumps
        if: github.event_name == 'pull_request'
        run: node scripts/validate.mjs --base origin/${{ github.base_ref }}
